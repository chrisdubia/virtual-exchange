<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification - The Virtual Exchange</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 48px;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .icon.success {
      background-color: #10b981;
      color: white;
    }

    .icon.error {
      background-color: #ef4444;
      color: white;
    }

    .icon.loading {
      background-color: #6b7280;
      color: white;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    h1 {
      color: #1f2937;
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .button {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .button:hover {
      background-color: #1d4ed8;
    }

    .button.secondary {
      background-color: #6b7280;
    }

    .button.secondary:hover {
      background-color: #4b5563;
    }

    .details {
      background-color: #f9fafb;
      border-radius: 8px;
      padding: 20px;
      margin-top: 24px;
      text-align: left;
    }

    .details strong {
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="container" id="content">
    <div class="icon loading">
      <span>⏳</span>
    </div>
    <h1>Verifying Email...</h1>
    <p>Please wait while we verify your email address.</p>
  </div>

  <script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      showError('No verification token provided', 'The verification link appears to be incomplete. Please check your email for the correct link.');
    } else {
      verifyEmail(token);
    }

    async function verifyEmail(token) {
      try {
        const response = await fetch('/api/verify-email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.alreadyVerified) {
            showSuccess('Already Verified', `Your email for ${data.organizationName} was already verified. Our team is reviewing your submission.`);
          } else {
            showSuccess(
              'Email Verified!',
              `Thank you! Your email has been verified for ${data.organizationName}. Our team will review your submission and get back to you within ${data.estimatedReviewTime || '2-3 business days'}.`
            );
          }
        } else {
          if (data.expired) {
            showError('Verification Link Expired', 'This verification link has expired. Please resubmit your organization to receive a new verification email.');
          } else {
            showError('Verification Failed', data.error || 'Unable to verify your email. Please try again or contact support.');
          }
        }
      } catch (error) {
        console.error('Verification error:', error);
        showError('Verification Failed', 'An error occurred while verifying your email. Please try again later or contact support at hello@mapworkslearning.org');
      }
    }

    function showSuccess(title, message) {
      document.getElementById('content').innerHTML = `
        <div class="icon success">
          <span>✓</span>
        </div>
        <h1>${title}</h1>
        <p>${message}</p>
        <div class="details">
          <strong>What's Next?</strong>
          <ul style="margin: 12px 0 0 20px; color: #6b7280;">
            <li>Check your email for confirmation</li>
            <li>Our team reviews your organization</li>
            <li>You'll receive approval notification</li>
            <li>Your organization goes live with verified badge ✓</li>
          </ul>
        </div>
        <a href="/" class="button" style="margin-top: 24px;">Return to Home</a>
      `;
    }

    function showError(title, message) {
      document.getElementById('content').innerHTML = `
        <div class="icon error">
          <span>✗</span>
        </div>
        <h1>${title}</h1>
        <p>${message}</p>
        <a href="/" class="button secondary">Return to Home</a>
        <div style="margin-top: 16px;">
          <a href="mailto:hello@mapworkslearning.org" style="color: #6b7280; text-decoration: underline; font-size: 14px;">Contact Support</a>
        </div>
      `;
    }
  </script>
</body>
</html>
